AWSTemplateFormatVersion: "2010-09-09"

Description: "Deploys the techcto/kubernetes-ui Dashboard (with native Keycloak OIDC/SSO) into an existing kubernetes cluster"

Metadata:

  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Dashboard"
        Parameters:
          - ClusterName
          - ClusterZone
          - Namespace
          - AccessNamespace
          - WebStackArn
      -
        Label:
          default: "Optional: SSO Configuration (Keycloak)"
        Parameters:
          - CloudOIDCUrl
          - CloudClientId
          - CloudClientSecret
          - CloudScope
          - SessionSigningKey
          - OIDCIssuerURL
          - MarketplaceProductCode

Parameters:

  ClusterName:
    Type: String

  WebStackArn:
    Type: String

  Namespace:
    Type: String
    Default: "kubernetes-dashboard"

  AccessNamespace:
    Type: String
    Description: "Organization namespace selected by default in Kubernetes UI."
    Default: default
    AllowedPattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

  ClusterZone:
    Description: This is the DNS Zone that for a single cluster
    Type: String
    Default: ""

  CloudOIDCUrl:
    Type: String
    Description: "Cloud's own OIDC issuer URL, for SSO login into the Dashboard - not to be confused with the EKS cluster's own OIDC provider (used for IRSA), which is a different thing entirely"
    Default: ""

  CloudClientId:
    Type: String
    Description: "Cloud's Keycloak client id for this cluster"
    Default: ""

  CloudClientSecret:
    Type: String
    Description: "Cloud's Keycloak client secret for this cluster"
    Default: ""

  CloudScope:
    Type: String
    Default: "openid profile email"

  SessionSigningKey:
    Type: String
    Description: "Key used to sign/verify the SSO session token exchanged between the auth and api services. Must be set to a real random value for SSO to work - the dashboard will still deploy without it, but SSO login will not."
    Default: ""
    NoEcho: true

  OIDCIssuerURL:
    Type: String
    Description: "EKS cluster OIDC issuer used by the auth service's Marketplace metering IRSA role"

  MarketplaceProductCode:
    Type: String
    Description: "AWS Marketplace product code. Empty disables metering for local/non-Marketplace builds."
    Default: ""

Conditions:

  HasSso: !Not [!Equals [!Ref CloudClientId, ""]]
  HasClusterZone: !Not [!Equals [!Ref ClusterZone, ""]]

Resources:

  MarketplaceMeteringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${OIDCIssuerURLWithoutProtocol}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {"StringEquals": {
                "${OIDCIssuerURLWithoutProtocol}:aud": "sts.amazonaws.com",
                "${OIDCIssuerURLWithoutProtocol}:sub": "system:serviceaccount:${Namespace}:kubernetes-dashboard-auth"
              }}
            }]
          }
        - OIDCIssuerURLWithoutProtocol: !Join ['', !Split ['https://', !Ref OIDCIssuerURL]]
      Policies:
        - PolicyName: marketplace-register-usage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aws-marketplace:RegisterUsage
                Resource: "*"

  Dashboard:
    Type: "Custom::Helm"
    Properties:
      ServiceToken: !Ref WebStackArn
      ClusterName: !Ref ClusterName
      Namespace: !Ref Namespace
      Repository: "http://solodev-kubernetes.s3-website-us-east-1.amazonaws.com/charts"
      Chart: kubernetes-dashboard
      Name: kubernetes-dashboard
      Version: 7.14.0
      ValueYaml: !If
        - HasSso
        - !Sub
          - |
            app:
              settings:
                global:
                  defaultNamespace: ${AccessNamespace}
                  namespaceFallbackList:
                    - ${AccessNamespace}
              ingress:
                enabled: ${IngressEnabled}
                hosts:
                  - ${ClusterName}.${ClusterZone}
                ingressClassName: nginx
                issuer:
                  name: letsencrypt-prod
                  scope: cluster
              image:
                pullPolicy: Always
            auth:
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: ${MarketplaceMeteringRole.Arn}
              image:
                repository: spacemade/kubernetes-ui-auth
                tag: latest
              containers:
                args:
                  - --v=1
                  - --oidc-issuer-url=${CloudOIDCUrl}
                  - --oidc-client-id=${CloudClientId}
                  - --oidc-client-secret=${CloudClientSecret}
                  - --oidc-redirect-url=https://${ClusterName}.${ClusterZone}/api/v1/oidc/callback
                  - --oidc-scopes=${CloudScope}
                  - --session-signing-key=${SessionSigningKey}
                  - --marketplace-product-code=${MarketplaceProductCode}
            api:
              image:
                repository: spacemade/kubernetes-ui-api
                tag: latest
              containers:
                args:
                  - --v=1
                  - --session-signing-key=${SessionSigningKey}
            web:
              image:
                repository: spacemade/kubernetes-ui-web
                tag: latest
          - IngressEnabled: !If [HasClusterZone, "true", "false"]
        - !Sub
          - |
            app:
              settings:
                global:
                  defaultNamespace: ${AccessNamespace}
                  namespaceFallbackList:
                    - ${AccessNamespace}
              ingress:
                enabled: ${IngressEnabled}
                hosts:
                  - ${ClusterName}.${ClusterZone}
                ingressClassName: nginx
                issuer:
                  name: letsencrypt-prod
                  scope: cluster
              image:
                pullPolicy: Always
            auth:
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: ${MarketplaceMeteringRole.Arn}
              image:
                repository: spacemade/kubernetes-ui-auth
                tag: latest
              containers:
                args:
                  - --v=1
                  - --marketplace-product-code=${MarketplaceProductCode}
            api:
              image:
                repository: spacemade/kubernetes-ui-api
                tag: latest
              containers:
                args:
                  - --v=1
            web:
              image:
                repository: spacemade/kubernetes-ui-web
                tag: latest
          - IngressEnabled: !If [HasClusterZone, "true", "false"]

Outputs:

  AdminUrl:
    Description: Point your DNS to this CNAME.
    Value: !Join ["", [!Ref ClusterName, ".", !Ref ClusterZone]]
