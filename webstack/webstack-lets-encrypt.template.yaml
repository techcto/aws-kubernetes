AWSTemplateFormatVersion: "2010-09-09"

Description: "Enables the cert-manager EKS add-on and configures Let's Encrypt ClusterIssuers in an existing Kubernetes cluster"

Metadata: 

  AWS::CloudFormation::Interface: 
    ParameterGroups: 
      - 
        Label:
          default: "Config"
        Parameters:
          - ClusterName
          - AdminEmail
          - WebStackArn

Parameters:

  ClusterName:
    Type: String

  AdminEmail:
    Type: String

  WebStackArn:
    Type: String

Resources:

  # AWS-managed add-on - handles CRDs itself and stays on a current, EKS-tested
  # version (v1.20.2 vs. the 1.7.2 the Helm chart was pinned to). No pod
  # identity/IRSA needed - Let's Encrypt is issued via HTTP01 through the
  # ingress, not a Route53 DNS01 solver.
  CertManager:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: cert-manager
      ClusterName: !Ref ClusterName
      ResolveConflicts: OVERWRITE
      ConfigurationValues: |
        {
          "webhook": {
            "securePort": 10251,
            "hostNetwork": true
          }
        }

  LetsEncrypt:
    DependsOn: CertManager
    Type: "AWS::CloudFormation::CustomResource"
    Properties:
      ServiceToken: !Ref WebStackArn
      ClusterName: !Ref ClusterName
      AdminEmail: !Ref AdminEmail
      LetsEncrypt:
        Enable: 'true'
